<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: radial-gradient(120% 90% at 50% 0%, #1b0b3a 0%, #0d0620 45%, #06030f 100%);
        color: #f5f3ff;
        font-family: 'Inter', system-ui, sans-serif;
        position: relative;
      }
      .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
      .g1 { top: -120px; left: -80px; width: 420px; height: 420px; background: rgba(139, 92, 246, 0.45); }
      .g2 { top: 180px; right: -140px; width: 460px; height: 460px; background: rgba(217, 70, 239, 0.35); }
      .g3 { bottom: -160px; left: 380px; width: 400px; height: 400px; background: rgba(34, 211, 238, 0.25); }

      .wrap {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 60px;
      }

      .eyebrow {
        font-size: 20px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: #22d3ee;
        margin-bottom: 34px;
      }

      .ball {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        overflow: hidden;
        position: relative;
        box-shadow: 0 0 60px rgba(139, 92, 246, 0.65);
        margin-bottom: 30px;
      }
      .ball .base {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 32% 28%, #ffffff 0%, #cfe9ff 14%, #a78bfa 42%, #5b21b6 72%, #1e0b3a 100%);
      }
      .ball .facets {
        position: absolute;
        inset: 0;
        background-image:
          repeating-linear-gradient(0deg, rgba(6, 3, 15, 0.45) 0 1px, transparent 1px 8px),
          repeating-linear-gradient(90deg, rgba(6, 3, 15, 0.45) 0 1px, transparent 1px 8px);
      }

      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 76px;
        font-weight: 500;
        line-height: 1.05;
      }

      .turns {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 22px 0 4px;
        font-size: 18px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #b9aeda;
      }
      .rule { width: 60px; height: 1px; background: rgba(255, 215, 110, 0.6); }

      .age {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 150px;
        line-height: 1;
        background: linear-gradient(180deg, #ffffff 0%, #ffd76e 45%, #d946ef 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 40px rgba(217, 70, 239, 0.5));
      }

      .date {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 34px;
        margin-top: 26px;
      }
      .dot { color: #d946ef; margin: 0 12px; }
    </style>
  </head>
  <body>
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="glow g3"></div>

    <div class="wrap">
      <p class="eyebrow">You are invited</p>

      <div class="ball">
        <div class="base"></div>
        <div class="facets"></div>
      </div>

      <h1>Maëlys Kadyjat</h1>

      <div class="turns">
        <span class="rule"></span>
        <span>turns</span>
        <span class="rule"></span>
      </div>

      <p class="age">9</p>

      <p class="date">Saturday <span class="dot">·</span> September 5th, 2026</p>
    </div>
  </body>
</html>
